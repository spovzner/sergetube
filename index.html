<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SergeTube</title>
<meta name="description" content="🎵 Music · 📚 HN Talks">
<meta property="og:title" content="SergeTube">
<meta property="og:description" content="🎵 Music · 📚 HN Talks">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e5484d'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#fff; --bg2:#f2f2f2; --bg3:#e5e5e5; --text:#0f0f0f; --muted:#606060; --line:#e5e5e5;
    --accent:#e5484d; --chip-on:#0f0f0f; --chip-on-text:#fff; --hover:rgba(0,0,0,.05); --link:#065fd4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f0f0f; --bg2:#272727; --bg3:#3f3f3f; --text:#f1f1f1; --muted:#aaa; --line:#303030;
      --chip-on:#f1f1f1; --chip-on-text:#0f0f0f; --hover:rgba(255,255,255,.08); --link:#3ea6ff;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f0f0f; --bg2:#272727; --bg3:#3f3f3f; --text:#f1f1f1; --muted:#aaa; --line:#303030;
    --chip-on:#f1f1f1; --chip-on-text:#0f0f0f; --hover:rgba(255,255,255,.08); --link:#3ea6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, select { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; }

  .top { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 20; background: var(--bg);
         display: flex; align-items: center; gap: 16px; padding: 0 16px; }
  .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .icon:hover { background: var(--hover); }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 19px; letter-spacing: -.5px; white-space: nowrap; }
  .brand i { width: 28px; height: 20px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand i::after { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .coll { height: 36px; padding: 0 10px; border-radius: 18px; background: var(--bg2); font-weight: 600; max-width: 220px; flex: none; }
  .coll option { background: var(--bg); }
  .search { flex: 0 1 600px; margin: 0 auto; display: flex; min-width: 0; }
  .search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; font: inherit; font-size: 16px; color: var(--text);
                  background: var(--bg); border: 1px solid var(--bg3); border-radius: 40px; outline: none; }
  .search input:focus { border-color: var(--link); }

  .side { position: fixed; top: 56px; bottom: 0; left: 0; width: 232px; overflow-y: auto; padding: 8px 12px 24px;
          background: var(--bg); z-index: 15; }
  .side a { display: flex; align-items: center; gap: 20px; height: 40px; padding: 0 12px; border-radius: 10px; }
  .side a:hover { background: var(--hover); }
  .side a.on { background: var(--bg2); font-weight: 500; }
  .side a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side a .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .side h4 { margin: 16px 12px 6px; font-size: 15px; font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .side .about { color: var(--muted); font-size: 12px; padding: 4px 12px; }
  .scrim { display: none; }

  main { margin-left: 232px; padding: 56px 24px 48px; }
  body.nav-closed .side { display: none; }
  body.nav-closed main { margin-left: 0; }

  .bar { position: sticky; top: 56px; z-index: 10; background: var(--bg); display: flex; gap: 12px; align-items: center; padding: 12px 0; }
  .chips { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--bg2); font-weight: 500; white-space: nowrap; }
  .chip:hover { background: var(--bg3); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .sort { height: 32px; padding: 0 8px; border-radius: 8px; background: var(--bg2); font-weight: 500; }
  .sort option { background: var(--bg); }
  .heading { margin: 8px 0 4px; font-size: 20px; }
  .count { color: var(--muted); margin: 0 0 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 36px 16px; padding-top: 8px; }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px;
         font-weight: 500; padding: 1px 4px; border-radius: 4px; }
  .later { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 4px; background: rgba(0,0,0,.8);
           color: #fff; display: none; place-items: center; }
  .later svg { width: 20px; height: 20px; }
  .card:hover .later, .later.on { display: grid; }
  .vt { margin: 12px 0 4px; font-size: 16px; font-weight: 500; line-height: 22px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); }
  .sum { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; }

  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; padding-top: 24px; max-width: 1700px; }
  .player { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .wt { font-size: 20px; font-weight: 600; margin: 12px 0 8px; line-height: 28px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pill { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--bg2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .pill:hover { background: var(--bg3); }
  .pill svg { width: 20px; height: 20px; }
  .box { background: var(--bg2); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .box h3 { margin: 0 0 6px; font-size: 14px; }
  .box p { margin: 0 0 6px; }
  .ev { border-top: 1px solid var(--line); padding: 10px 0 2px; }
  .ev:first-of-type { border-top: 0; }
  .ev .src { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .ev .src a { color: var(--link); }
  .ev blockquote { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tags a { color: var(--link); }
  .next .card { display: grid; grid-template-columns: 168px 1fr; gap: 8px; margin-bottom: 8px; }
  .next .thumb { border-radius: 8px; }
  .next .vt { margin: 0 0 4px; font-size: 14px; line-height: 20px; }
  .next .sub { font-size: 12px; }
  .next .sum { display: none; }

  .keys { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; place-items: center; z-index: 50; }
  .keys.on { display: grid; }
  .keys div { background: var(--bg); border-radius: 12px; padding: 20px 24px; min-width: 280px; }
  .keys kbd { display: inline-block; min-width: 24px; padding: 1px 6px; border: 1px solid var(--bg3); border-radius: 4px; text-align: center; margin-right: 8px; }

  @media (max-width: 1100px) { .watch { grid-template-columns: 1fr; } }
  @media (max-width: 800px) {
    .side { display: none; width: 260px; }
    body.nav-open .side { display: block; }
    body.nav-open .scrim { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.4); z-index: 14; }
    main, body.nav-closed main { margin-left: 0; padding: 56px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .next .card { grid-template-columns: 140px 1fr; }
  }
  @media (max-width: 600px) { .brand b { display: none; } .coll { max-width: 150px; } .search input { padding: 0 12px; } }
  @media (max-width: 420px) { .top { gap: 8px; padding: 0 8px; } }
</style>
</head>
<body>
<header class="top">
  <button class="icon" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <a class="brand" href="#/"><i></i><b id="brandName">SergeTube</b></a>
  <select class="coll" id="coll" aria-label="Collection"></select>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
  </form>
  <button class="icon" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>
</header>
<nav class="side" id="side"></nav>
<div class="scrim" id="scrim"></div>
<main id="main"><p class="empty">Loading…</p></main>
<div class="keys" id="keys"><div>
  <h3 style="margin-top:0">Keyboard shortcuts</h3>
  <p><kbd>/</kbd>Search</p><p><kbd>j</kbd><kbd>k</kbd>Next / previous video</p>
  <p><kbd>w</kbd>Save to Watch later</p><p><kbd>r</kbd>Random video</p>
  <p><kbd>1</kbd>–<kbd>9</kbd>Switch collection</p><p><kbd>Esc</kbd>Back to the feed</p><p><kbd>?</kbd>This help</p>
</div></div>

<script>
(() => {
  // ── storage (per-viewer conveniences only; the page works without it) ──
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const theme = store.get("theme", null);
  if (theme) document.documentElement.dataset.theme = theme;

  let SITE = { site: {}, collections: [] };
  const catalogs = new Map();          // slug -> {topics, videos, byId}
  let C = null;                        // current collection meta
  let DATA = { topics: [], videos: [] };
  let byId = new Map();
  let later = new Set();
  let shuffleSeed = Math.random();
  let lastList = [];
  const PAGE = 48;

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
  const ICON_LATER = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>';
  const ICON_DONE = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

  const fmtDur = (s) => {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
  };
  const fmtNum = (n) => n == null ? "" : n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
  const fmtAgo = (d) => {
    if (!d) return "";
    const y = (Date.now() - new Date(d)) / 3.156e10;
    if (y >= 1) return Math.floor(y) + (Math.floor(y) === 1 ? " year ago" : " years ago");
    const mo = Math.floor(y * 12);
    return mo >= 1 ? mo + (mo === 1 ? " month ago" : " months ago") : "recently";
  };
  const subline = (v) => [v.views != null && fmtNum(v.views) + " views", fmtAgo(v.published),
    v.mentions > 1 && v.mentions + " recommendations"].filter(Boolean).join(" · ");
  const thumb = (id) => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  const enc = encodeURIComponent;
  const href = (path = "") => `#/${C.slug}${path ? "/" + path : ""}`;

  async function loadCollection(slug) {
    if (!catalogs.has(slug)) {
      const d = await fetch(`c/${slug}.json`).then((r) => r.json());
      d.byId = new Map(d.videos.map((v) => [v.id, v]));
      catalogs.set(slug, d);
    }
    C = SITE.collections.find((c) => c.slug === slug);
    DATA = catalogs.get(slug);
    byId = DATA.byId;
    later = new Set(store.get("later:" + slug, []));
    store.set("lastCollection", slug);
    document.title = `${C.name} · ${SITE.site.name || "SergeTube"}`;
    $("#coll").value = slug;
  }

  // ── routing: #/<collection>[/topic/X | /later | /search/q | /v/ID] ──
  async function route() {
    let parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
    const slugs = SITE.collections.map((c) => c.slug);
    let slug = parts[0];
    if (!slugs.includes(slug)) {
      // No collection in the link: use the last one visited, else the first non-empty one.
      const remembered = store.get("lastCollection", null);
      slug = slugs.includes(remembered) ? remembered
        : (SITE.collections.find((c) => c.count > 0) || SITE.collections[0]).slug;
      if (parts[0] === "v") {
        // Old-style video link (#/v/ID): find the collection that has this video.
        for (const s of slugs) {
          await loadCollection(s);
          if (byId.has(parts[1])) { slug = s; break; }
        }
      }
      if (parts[0] === "") parts = [slug];
      else parts = [slug, ...parts];
      history.replaceState(null, "", "#/" + parts.map(enc).join("/"));
    }
    if (!C || C.slug !== slug) await loadCollection(slug);
    parts = parts.slice(1);
    document.body.classList.remove("nav-open");
    if (parts[0] === "v" && byId.has(parts[1])) return renderWatch(byId.get(parts[1]));
    if (parts[0] === "topic") return renderFeed({ topic: parts[1] });
    if (parts[0] === "later") return renderFeed({ later: true });
    if (parts[0] === "search") return renderFeed({ q: parts.slice(1).join("/") });
    renderFeed({});
  }

  function renderSide(state) {
    const counts = {};
    DATA.videos.forEach((v) => v.topics.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
    const on = (cond) => (cond ? "on" : "");
    const home = !state.topic && !state.later && !state.q && !state.watch;
    const cols = SITE.collections.map((c) =>
      `<a class="${on(c.slug === C.slug)}" href="#/${c.slug}"><span style="width:24px;text-align:center">${esc(c.icon)}</span><span>${esc(c.name)}${c.public ? "" : " 🔒"}</span><span class="n">${c.count}</span></a>`).join("");
    $("#side").innerHTML = `
      ${SITE.collections.length > 1 ? `<h4 style="margin-top:4px">Collections</h4>${cols}<hr>` : ""}
      <a class="${on(home)}" href="${href()}"><svg viewBox="0 0 24 24"><path d="M4 21V10.08l8-6.96 8 6.96V21h-6v-6h-4v6H4z"/></svg><span>Home</span></a>
      <a class="${on(state.later)}" href="${href("later")}">${ICON_LATER}<span>Watch later</span><span class="n">${later.size || ""}</span></a>
      <a href="#" id="rand"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1z"/></svg><span>Random</span></a>
      ${DATA.topics.length ? "<hr><h4>Topics</h4>" : ""}
      ${DATA.topics.map((t) => `<a class="${on(state.topic === t)}" href="${href("topic/" + enc(t))}"><span>${esc(t)}</span><span class="n">${counts[t] || ""}</span></a>`).join("")}
      <hr><p class="about">${esc(C.tagline || "")}</p>
      <p class="about">${DATA.videos.length} videos · press <b>?</b> for shortcuts</p>`;
    $("#rand").onclick = (e) => { e.preventDefault(); randomVideo(); };
  }

  function sorted(list, how) {
    const l = list.slice();
    if (how === "new") l.sort((a, b) => (b.published || b.first_seen || "").localeCompare(a.published || a.first_seen || ""));
    else if (how === "mentions") l.sort((a, b) => b.mentions - a.mentions || b.rank - a.rank);
    else if (how === "long") l.sort((a, b) => (b.duration || 0) - (a.duration || 0));
    else if (how === "shuffle") {
      const h = (s) => { let x = 0; for (const c of s + shuffleSeed) x = (x * 31 + c.charCodeAt(0)) | 0; return x; };
      l.sort((a, b) => h(a.id) - h(b.id));
    }
    return l; // "top": already in rank order
  }

  function card(v) {
    const saved = later.has(v.id);
    return `<a class="card" href="${href("v/" + v.id)}">
      <div class="thumb"><img loading="lazy" src="${thumb(v.id)}" alt="">
        ${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ""}
        <span class="later ${saved ? "on" : ""}" data-later="${v.id}" title="Watch later">${saved ? ICON_DONE : ICON_LATER}</span></div>
      <div><h3 class="vt">${esc(v.title)}</h3><div class="sub">${esc(v.channel)}</div>
        <div class="sub">${esc(subline(v))}</div>${v.summary ? `<div class="sum">${esc(v.summary)}</div>` : ""}</div></a>`;
  }

  function renderFeed(state) {
    renderSide(state);
    const sort = store.get("sort", "top");
    let list = DATA.videos;
    let heading = "";
    if (state.topic) { list = list.filter((v) => v.topics.includes(state.topic)); heading = state.topic; }
    if (state.later) { list = [...later].map((id) => byId.get(id)).filter(Boolean); heading = "Watch later"; }
    if (state.q) {
      const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      list = list.filter((v) => {
        const hay = [v.title, v.channel, v.summary, v.topics.join(" "), v.evidence.map((e) => e.text).join(" ")].join(" ").toLowerCase();
        return terms.every((t) => hay.includes(t));
      });
      heading = `Results for “${state.q}” in ${C.name}`;
      $("#q").value = state.q;
    } else $("#q").value = "";
    if (!state.later) list = sorted(list, sort);
    lastList = list;
    const chips = DATA.topics.slice(0, 30).map((t) =>
      `<a class="chip ${state.topic === t ? "on" : ""}" href="${href("topic/" + enc(t))}">${esc(t)}</a>`).join("");
    $("#main").innerHTML = `
      <div class="bar">
        <div class="chips"><a class="chip ${!state.topic ? "on" : ""}" href="${href()}">All</a>${chips}</div>
        ${state.later ? "" : `<select class="sort" id="sort" aria-label="Sort">
          ${[["top", "Top picks"], ["new", "Newest"], ["mentions", "Most recommended"], ["long", "Longest"], ["shuffle", "Shuffle"]]
            .map(([k, l]) => `<option value="${k}" ${k === sort ? "selected" : ""}>${l}</option>`).join("")}</select>`}
      </div>
      ${heading ? `<h2 class="heading">${esc(heading)}</h2><p class="count">${list.length} videos</p>` : ""}
      <div class="grid" id="grid"></div><div id="more" style="height:1px"></div>
      ${list.length ? "" : `<p class="empty">${state.later ? "Nothing saved yet. Hover a video and click the clock." :
        DATA.videos.length ? "No videos here." : "This collection is empty so far. Run <code>uv run curatube all " + esc(C.slug) + "</code>."}</p>`}`;
    const sel = $("#sort");
    if (sel) sel.onchange = () => { store.set("sort", sel.value); if (sel.value === "shuffle") shuffleSeed = Math.random(); route(); };
    let shown = 0;
    const grid = $("#grid");
    const more = () => { grid.insertAdjacentHTML("beforeend", list.slice(shown, shown + PAGE).map(card).join("")); shown += PAGE; };
    more();
    new IntersectionObserver((es) => es[0].isIntersecting && shown < list.length && more(), { rootMargin: "800px" }).observe($("#more"));
    window.scrollTo(0, 0);
  }

  function renderWatch(v) {
    renderSide({ watch: true });
    const saved = later.has(v.id);
    const related = DATA.videos.filter((x) => x.id !== v.id)
      .map((x) => [x, x.topics.filter((t) => v.topics.includes(t)).length]).filter(([, n]) => n)
      .sort((a, b) => b[1] - a[1] || b[0].rank - a[0].rank).slice(0, 20).map(([x]) => x);
    const upNext = related.length ? related : DATA.videos.filter((x) => x.id !== v.id).slice(0, 20);
    lastList = [v, ...upNext];
    const evidence = v.evidence.map((e) => {
      const u = safeUrl(e.url);
      const label = esc(e.label || "Source");
      return `<div class="ev"><div class="src">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : label}${e.date ? " · " + esc(e.date) : ""}</div>
        ${e.text ? `<blockquote>${esc(e.text)}</blockquote>` : ""}</div>`;
    }).join("");
    $("#main").innerHTML = `<div class="watch">
      <div>
        <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&autoplay=1"
          title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <h1 class="wt">${esc(v.title)}</h1>
        <div class="row">
          <b>${esc(v.channel)}</b><span class="sub">${esc(subline(v))}</span>
          <span style="flex:1"></span>
          <button class="pill" data-later="${v.id}">${saved ? ICON_DONE + "Saved" : ICON_LATER + "Watch later"}</button>
          <a class="pill" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Open on YouTube</a>
        </div>
        ${v.summary || v.reason ? `<div class="box">${v.summary ? `<p>${esc(v.summary)}</p>` : ""}
          ${v.reason ? `<p class="sub">Why it's here: ${esc(v.reason)}${v.score != null ? ` (fit ${v.score}/10)` : ""}</p>` : ""}
          ${v.topics.length ? `<div class="tags">${v.topics.map((t) => `<a href="${href("topic/" + enc(t))}">#${esc(t)}</a>`).join("")}</div>` : ""}</div>` : ""}
        ${evidence ? `<div class="box"><h3>Recommended by ${v.mentions} ${v.mentions === 1 ? "person" : "people"}</h3>${evidence}</div>` : ""}
      </div>
      <div class="next">${upNext.map(card).join("")}</div></div>`;
    window.scrollTo(0, 0);
  }

  function randomVideo() {
    const v = DATA.videos[Math.floor(Math.random() * DATA.videos.length)];
    if (v) location.hash = href("v/" + v.id);
  }

  function toggleLater(id) {
    later.has(id) ? later.delete(id) : later.add(id);
    store.set("later:" + C.slug, [...later]);
    route();
  }

  // ── events ──
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-later]");
    if (b) { e.preventDefault(); e.stopPropagation(); toggleLater(b.dataset.later); }
  }, true);
  $("#coll").onchange = (e) => { location.hash = "#/" + e.target.value; };
  $("#menu").onclick = () => {
    if (matchMedia("(max-width: 800px)").matches) document.body.classList.toggle("nav-open");
    else document.body.classList.toggle("nav-closed");
  };
  $("#scrim").onclick = () => document.body.classList.remove("nav-open");
  $("#theme").onclick = () => {
    const dark = getComputedStyle(document.body).backgroundColor === "rgb(15, 15, 15)";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    store.set("theme", document.documentElement.dataset.theme);
  };
  $("#searchForm").onsubmit = (e) => {
    e.preventDefault();
    const q = $("#q").value.trim();
    location.hash = q ? href("search/" + enc(q)) : href();
    $("#q").blur();
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    const cur = location.hash.match(/\/v\/([\w-]{11})/)?.[1];
    const idx = lastList.findIndex((v) => v.id === cur);
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
    else if (e.key === "?") $("#keys").classList.toggle("on");
    else if (e.key === "Escape") { $("#keys").classList.contains("on") ? $("#keys").classList.remove("on") : (location.hash = href()); }
    else if (e.key === "r") randomVideo();
    else if (e.key === "w" && cur) toggleLater(cur);
    else if (e.key === "j" && lastList.length) location.hash = href("v/" + (lastList[idx + 1] || lastList[0]).id);
    else if (e.key === "k" && idx > 0) history.back();
    else if (/^[1-9]$/.test(e.key) && SITE.collections[+e.key - 1]) location.hash = "#/" + SITE.collections[+e.key - 1].slug;
  });
  $("#keys").onclick = () => $("#keys").classList.remove("on");
  window.addEventListener("hashchange", route);

  fetch("collections.json").then((r) => r.json()).then((d) => {
    SITE = d;
    $("#coll").innerHTML = d.collections.map((c) =>
      `<option value="${esc(c.slug)}">${esc(c.icon)} ${esc(c.name)}${c.public ? "" : " 🔒"}</option>`).join("");
    $("#coll").style.display = d.collections.length > 1 ? "" : "none";
    return route();
  }).catch(() => { $("#main").innerHTML = '<p class="empty">Couldn’t load the site data. Run <code>uv run curatube build</code>.</p>'; });
})();
</script>
</body>
</html>
